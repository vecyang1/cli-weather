[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-weather"
version = "2.0.0"
description = "Production-grade, ultra-compact terminal weather interface (<150 tokens) with multi-city concurrency and 4-tier provider cascade."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "V"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
keywords = ["weather", "cli", "terminal", "token-efficient", "agent", "llm", "open-meteo"]
dependencies = []

[project.urls]
Homepage = "https://github.com/vecyang1/cli-weather"
Repository = "https://github.com/vecyang1/cli-weather"
Issues = "https://github.com/vecyang1/cli-weather/issues"

[project.scripts]
weather = "cli_weather.cli:main"
cli-weather = "cli_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
